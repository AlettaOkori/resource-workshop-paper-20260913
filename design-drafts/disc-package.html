<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资源卡片 · 碟片包装盒设计稿</title>
<style>
:root{--paper:#eeede7;--sheet:#f9f8f3;--ink:#252722;--muted:#77786f;--rule:#d3d2c8;--red:#bf3034;--serif:Georgia,"Songti SC",serif;--sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans)}.page{max-width:1440px;margin:auto;padding:56px 64px 90px}.mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:12px;color:var(--muted);font-size:11px;letter-spacing:.16em}.mast strong{font:500 20px var(--serif);letter-spacing:.04em;color:var(--ink)}.intro{max-width:660px;margin:74px auto 66px;text-align:center}.intro p{margin:0;color:var(--muted);font-size:12px;letter-spacing:.12em}.intro h1{margin:17px 0 0;font:500 clamp(32px,4vw,56px)/1.2 var(--serif);letter-spacing:.02em}.intro h1 em{font-style:normal;color:var(--red)}.shelf{display:flex;align-items:flex-end;gap:15px;min-height:466px;padding-top:60px}.case{--h:245px;--grow:1;flex:var(--grow) 1 0;min-width:0;position:relative;transition:transform .3s cubic-bezier(.2,.75,.3,1)}.case:hover{transform:translateY(-8px)}.case:nth-child(1){--h:245px;--grow:.86}.case:nth-child(2){--h:285px}.case:nth-child(3){--h:325px;--grow:1.13}.case:nth-child(4){--h:355px;--grow:1.25}.case:nth-child(5){--h:310px;--grow:1.12}.case:nth-child(6){--h:265px;--grow:.96}.type{height:17px;margin-bottom:9px;color:var(--muted);font-size:10px;letter-spacing:.1em}.box{height:var(--h);position:relative;overflow:hidden;background:var(--sheet);border:1px solid #c9c9bf;border-radius:4px;box-shadow:2px 5px 9px #27291f12}.box:before{content:"";position:absolute;inset:5px;z-index:3;border:1px solid #fff8;border-radius:2px;pointer-events:none;box-shadow:inset 0 0 0 1px #25272212}.box:after{content:"";position:absolute;z-index:2;pointer-events:none;width:63%;aspect-ratio:1;right:-22%;bottom:-15%;border-radius:50%;background:radial-gradient(circle, #f8f7ef99 0 8%,#25272233 8.5% 10%,#f8f7ef66 10.5% 12%,#f8f7ef26 12.5% 45%,#2527223d 45.5% 47%,transparent 47.5%);opacity:.48;transform:rotate(-18deg)}.art{width:100%;height:100%;display:block;object-fit:cover;opacity:.96}.disc-mark{position:absolute;right:10px;top:10px;z-index:4;width:27px;height:27px;border:1px solid #2527222b;border-radius:50%;background:#f9f8f3e8;display:grid;place-items:center;color:var(--muted);font-size:10px}.info{min-height:84px;padding:12px 11px 10px;background:var(--sheet);border:1px solid #c9c9bf;border-top:0;border-radius:0 0 4px 4px}.info h2{margin:0;font:500 16px/1.45 var(--serif);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font-size:11px}.meta span:last-child{letter-spacing:.04em}.footer{display:flex;justify-content:space-between;border-top:1px solid var(--rule);margin-top:30px;padding-top:14px;color:var(--muted);font-size:11px}.note{color:var(--red)}
@media(max-width:900px){.page{padding:34px 22px 60px}.shelf{overflow:auto;margin:0 -22px;padding:55px 22px 20px;gap:13px}.case{flex:0 0 160px}.intro{margin:48px auto 35px}.footer{display:block;line-height:1.8}.note{display:block;margin-top:5px}}
</style></head><body><main class="page"><header class="mast"><strong>AI资源工坊</strong><span>DESIGN STUDY / 04</span></header><section class="intro"><p>数字教学作品 · 视觉方向</p><h1>把每一份资源，<br>装进自己的<em>一张碟</em>。</h1></section><section class="shelf" aria-label="资源卡片设计稿">
<article class="case"><div class="type">互动动画</div><div class="box"><img class="art" src="/paper-theme/assets/photosynthesis.svg"><span class="disc-mark">01</span></div><div class="info"><h2>光合作用</h2><div class="meta"><span>生物 · 王红敏</span><span>♡ 34</span></div></div></article>
<article class="case"><div class="type">互动动画</div><div class="box"><img class="art" src="/paper-theme/assets/geometry.svg"><span class="disc-mark">02</span></div><div class="info"><h2>勾股定理</h2><div class="meta"><span>数学 · 王红敏</span><span>♡ 28</span></div></div></article>
<article class="case"><div class="type">互动动画</div><div class="box"><img class="art" src="/paper-theme/assets/cell.svg"><span class="disc-mark">03</span></div><div class="info"><h2>细胞结构</h2><div class="meta"><span>生物 · 王红敏</span><span>♡ 21</span></div></div></article>
<article class="case"><div class="type">互动课件</div><div class="box"><img class="art" src="/paper-theme/assets/lifetime.svg"><span class="disc-mark">04</span></div><div class="info"><h2>人生有几万天</h2><div class="meta"><span>综合实践 · 王红敏</span><span>♡ 47</span></div></div></article>
<article class="case"><div class="type">试卷</div><div class="box"><img class="art" src="/paper-theme/assets/exam.svg"><span class="disc-mark">05</span></div><div class="info"><h2>三位数乘两位数同步练习</h2><div class="meta"><span>数学 · 王红敏</span><span>♡ 19</span></div></div></article>
<article class="case"><div class="type">试卷</div><div class="box"><img class="art" src="/paper-theme/assets/exam.svg"><span class="disc-mark">06</span></div><div class="info"><h2>七年级下第七单元测试</h2><div class="meta"><span>数学 · 王红敏</span><span>♡ 26</span></div></div></article>
</section><footer class="footer"><span>薄塑料盒 · 纸质内页 · 可继续创作</span><span class="note">先看设计，再接入首页</span></footer></main></body></html>
