<!DOCTYPE html>
<html lang="zh-CN"><head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>数学黄金矿工</title>
    
    <!-- Tailwind CSS -->
    <script src="/artifacts/vendor/tailwind-metis.js"></script>
    
    <!-- Anime.js -->
    <script src="/artifacts/vendor/anime.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#FFB300', // 金色
                        secondary: '#5D4037', // 土壤色
                        accent: '#E53935', // 红色强调
                        sky: '#81D4FA'
                    },
                    fontFamily: {
                        sans: ['"Comic Sans MS"', 'Chalkboard SE', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body {
            overflow: hidden;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }
        
        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-ui {
            pointer-events: auto;
        }

        /* 答题弹窗动画 */
        .quiz-modal {
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .miner-img {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            z-index: 5;
            filter: drop-shadow(0 4px 6px rgba(0,0,0,0.3));
        }

        /* 按钮样式 */
        .btn-game {
            background: linear-gradient(to bottom, #FFD54F, #FFB300);
            border: 4px solid #FFF;
            box-shadow: 0 6px 0 #F57F17, 0 10px 10px rgba(0,0,0,0.3);
            transition: all 0.1s;
        }
        .btn-game:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #F57F17, 0 4px 4px rgba(0,0,0,0.3);
        }

        .bg-pattern {
            background-image: url('/artifacts/miner/assets/k8Q-6.jpg');
            background-size: cover;
            background-position: center;
        }
    </style>

<body class="bg-gray-900 text-white">

    <!-- 背景层 -->
    <div class="absolute inset-0 bg-pattern opacity-90"></div>
    
    <!-- 矿工装饰 -->
    <img src="/artifacts/miner/assets/NQL-4.jpg" class="miner-img" alt="Miner">

    <!-- 游戏画布 -->
    <canvas id="game-canvas" width="2510" height="1204"></canvas>

    <!-- UI 层 -->
    <div class="ui-layer flex flex-col justify-between p-4">
        <!-- 顶部信息栏：改为左右布局，避开中间矿工 -->
        <div class="flex justify-between items-start w-full">
            <!-- 左侧：分数信息 -->
            <div class="flex flex-col gap-2">
                <div class="bg-black/50 rounded-xl p-3 border-2 border-primary backdrop-blur-sm min-w-[120px]">
                    <div class="text-xs text-gray-300">目标分数</div>
                    <div class="text-xl font-bold text-primary" id="target-score">0</div>
                </div>
                
                <div class="bg-black/50 rounded-xl p-3 border-2 border-primary backdrop-blur-sm min-w-[120px]">
                    <div class="text-xs text-gray-300">当前分数</div>
                    <div class="text-2xl font-bold text-yellow-300" id="current-score">0</div>
                </div>
            </div>

            <!-- 右侧：时间信息 -->
            <div class="bg-black/50 rounded-xl p-3 border-2 border-primary backdrop-blur-sm min-w-[100px] text-center">
                <div class="text-xs text-gray-300">剩余时间</div>
                <div class="text-2xl font-bold text-white" id="time-left">60</div>
            </div>
        </div>

        <!-- 底部关卡信息 -->
        <div class="text-center pb-4">
            <span class="bg-secondary/80 px-6 py-2 rounded-full text-lg font-bold border border-white/30">
                第 <span id="level-display">1</span> 关
            </span>
        </div>
    </div>

    <!-- 开始/暂停/结束 覆盖层 -->
    <div id="overlay" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm interactive-ui">
        <div class="bg-white text-gray-800 rounded-3xl p-8 max-w-md w-full text-center shadow-2xl border-8 border-primary transform transition-all scale-100">
            <h1 class="text-4xl font-bold mb-2 text-secondary" id="overlay-title">数学矿工</h1>
            <p class="text-gray-600 mb-8 text-lg" id="overlay-desc">用数学知识抓取宝藏！</p>
            
            <div class="space-y-4">
                <button id="start-btn" class="btn-game w-full py-4 rounded-xl text-2xl font-bold text-secondary">
                    开始游戏
                </button>
                <div class="text-sm text-gray-500 mt-4">
                    点击屏幕发射钩子<br>抓到金块后回答数学题
                </div>
            </div>
        </div>
    </div>

    <!-- 答题弹窗 (默认隐藏) -->
    <div id="quiz-modal" class="fixed inset-0 z-40 flex items-center justify-center bg-black/60 hidden interactive-ui quiz-modal">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full mx-4 shadow-2xl border-4 border-blue-500 relative overflow-hidden">
            <!-- 装饰背景 -->
            <div class="absolute top-0 left-0 w-full h-2 bg-blue-500"></div>
            
            <div class="text-center mb-6">
                <div class="text-gray-500 text-sm mb-1">抓到宝藏了！快回答：</div>
                <div class="text-5xl font-bold text-gray-800 font-mono my-4" id="question-text">5 + 3 = ?</div>
            </div>

            <div class="grid grid-cols-2 gap-4" id="options-container">
                <!-- 选项按钮将通过JS生成 -->
            </div>
            
            <!-- 倒计时条 -->
            <div class="w-full bg-gray-200 h-2 mt-6 rounded-full overflow-hidden">
                <div id="quiz-timer-bar" class="h-full bg-blue-500 w-full"></div>
            </div>
        </div>
    </div>

    <!-- 音频资源 -->
    <audio id="bgm-audio" src="/artifacts/miner/assets/K6C-1.mp3" preload="auto"></audio>

    <script type="module">
        // 游戏配置
        const CONFIG = {
            hookSpeed: 8,
            hookRotateSpeed: 0.015, // 降低摆动速度 (原0.03 -> 0.015)
            hookMaxAngle: 70 * Math.PI / 180,
            ropeLength: 100,
            colors: {
                gold: ['#FFD54F', '#FF6F00'],
                stone: ['#9E9E9E', '#424242'],
                diamond: ['#4FC3F7', '#0288D1'],
                bag: ['#EF5350', '#B71C1C']
            }
        };

        // 游戏状态
        const STATE = {
            IDLE: 'IDLE',       // 钩子摆动中
            SHOOT: 'SHOOT',     // 钩子发射中
            GRAB: 'GRAB',       // 抓取返回中
            QUIZ: 'QUIZ',       // 答题中
            PAUSE: 'PAUSE',     // 暂停/结束
            LEVEL_TRANSITION: 'TRANSITION'
        };

        class Game {
            constructor() {
                this.canvas = document.getElementById('game-canvas');
                this.ctx = this.canvas.getContext('2d');
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                
                this.state = STATE.PAUSE;
                this.level = 1;
                this.score = 0;
                this.targetScore = 500;
                this.timeLeft = 60;
                this.lastTime = 0;
                
                this.hook = {
                    x: this.width / 2,
                    y: 100,
                    angle: 0,
                    length: CONFIG.ropeLength,
                    direction: 1, // 1: right, -1: left
                    status: 'SWING', // SWING, SHOOT, REWIND
                    grabbedItem: null,
                    speed: CONFIG.hookSpeed
                };
                
                this.swingTime = 0; // 用于正弦摆动

                this.items = [];
                this.particles = [];
                
                // 资源
                this.assets = {
                    hook: new Image(),
                    gold: new Image(),
                    stone: new Image(),
                    bag: new Image(),
                    bomb: new Image()
                };
                this.assets.hook.src = '/artifacts/miner/assets/wGc-8.jpg';
                this.assets.gold.src = '/artifacts/miner/assets/Jgs-2.jpg';
                this.assets.stone.src = '/artifacts/miner/assets/VGD-5.jpg';
                this.assets.bag.src = '/artifacts/miner/assets/od2-7.jpg';
                this.assets.bomb.src = '/artifacts/miner/assets/Lhm-3.jpg';
                
                this.audio = document.getElementById('bgm-audio');
                
                this.initEvents();
                this.resize();
                
                // 启动循环
                requestAnimationFrame(this.loop.bind(this));
            }

            resize() {
                this.width = window.innerWidth;
                this.height = window.innerHeight;
                this.canvas.width = this.width;
                this.canvas.height = this.height;
                this.hook.x = this.width / 2;
            }

            initEvents() {
                window.addEventListener('resize', () => this.resize());
                
                // 点击发射
                const shootHandler = (e) => {
                    if (e.target.closest('.interactive-ui')) return; // 点击UI不触发
                    if (this.state === STATE.IDLE) {
                        this.hook.status = 'SHOOT';
                        this.state = STATE.SHOOT;
                    }
                };
                
                window.addEventListener('mousedown', shootHandler);
                window.addEventListener('touchstart', shootHandler);

                // UI 按钮
                document.getElementById('start-btn').addEventListener('click', () => {
                    this.startGame();
                    // 播放开场音效 (0-4s)
                    this.playAudio(0, 4);
                });
            }

            playAudio(start, duration) {
                try {
                    this.audio.currentTime = start;
                    this.audio.play();
                    setTimeout(() => {
                        this.audio.pause();
                    }, duration * 1000);
                } catch (e) {
                    console.log('Audio play failed', e);
                }
            }

            playCorrectSound() {
                // 使用 Web Audio API 合成简单的正确音效
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1000, ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.5);
                
                // 也可以尝试播放预制音频的第二段
                // this.playAudio(4.5, 2.5); 
            }

            playWrongSound() {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.3);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.3);
            }

            initLevel() {
                this.items = [];
                
                // 1. 生成保底金块 (至少5个)
                const goldCount = 5 + Math.floor(Math.random() * 3); // 5-7个
                for(let i=0; i<goldCount; i++) {
                    this.createItem('gold');
                }

                // 2. 生成保底石头 (至少7个)
                const stoneCount = 7 + Math.floor(Math.random() * 3); // 7-9个
                for(let i=0; i<stoneCount; i++) {
                    this.createItem('stone');
                }

                // 3. 随机生成其他物品 (钻石、福袋、炸药)
                const otherCount = 5 + this.level;
                for(let i=0; i<otherCount; i++) {
                    const r = Math.random();
                    if (r < 0.5) this.createItem('diamond'); // 钻石 50%
                    else if (r < 0.8) this.createItem('bag'); // 福袋 30%
                    else this.createItem('bomb'); // 炸药 20%
                }
            }

            createItem(type) {
                let item = {
                    type: type,
                    rotation: Math.random() * Math.PI * 2
                };

                // 尝试找到不重叠的位置
                let attempts = 0;
                let validPosition = false;
                while (!validPosition && attempts < 50) {
                    item.x = Math.random() * (this.width - 100) + 50;
                    item.y = Math.random() * (this.height - 300) + 250;
                    
                    // 设置属性
                    if (type === 'gold') {
                        item.radius = 40 + Math.random() * 40; // 最小尺寸翻倍 (原20 -> 40)
                        item.weight = item.radius / 8; // 越大越重
                        item.score = Math.floor(item.radius * 10);
                    } else if (type === 'stone') {
                        item.radius = 50 + Math.random() * 35; // 最小尺寸翻倍 (原25 -> 50)
                        item.weight = item.radius / 4; // 石头更重
                        item.score = Math.floor(item.radius * 1.5);
                    } else if (type === 'diamond') {
                        item.radius = 15;
                        item.weight = 1;
                        item.score = 500;
                    } else if (type === 'bag') {
                        item.radius = 25;
                        item.weight = 2;
                        item.score = 'BLIND_BOX';
                    } else if (type === 'bomb') {
                        item.radius = 30;
                        item.weight = 3;
                        item.score = -100; // 炸药扣分
                    }

                    // 碰撞检测
                    validPosition = true;
                    for (let other of this.items) {
                        const dx = item.x - other.x;
                        const dy = item.y - other.y;
                        if (Math.sqrt(dx*dx + dy*dy) < item.radius + other.radius + 5) {
                            validPosition = false;
                            break;
                        }
                    }
                    attempts++;
                }

                if (validPosition) {
                    this.items.push(item);
                }
            }

            startGame() {
                document.getElementById('overlay').classList.add('hidden');
                this.score = 0;
                this.level = 1;
                this.startLevel();
            }

            startLevel() {
                this.state = STATE.IDLE;
                this.timeLeft = 60;
                this.targetScore = this.level * 500;
                this.hook.status = 'SWING';
                this.hook.length = CONFIG.ropeLength;
                this.hook.grabbedItem = null;
                
                this.updateUI();
                this.initLevel();
                
                // 计时器
                if (this.timerInterval) clearInterval(this.timerInterval);
                this.timerInterval = setInterval(() => {
                    if (this.state !== STATE.PAUSE && this.state !== STATE.QUIZ) {
                        this.timeLeft--;
                        document.getElementById('time-left').innerText = this.timeLeft;
                        if (this.timeLeft <= 0) {
                            this.endLevel();
                        }
                    }
                }, 1000);
            }

            endLevel() {
                clearInterval(this.timerInterval);
                this.state = STATE.PAUSE;
                
                const overlay = document.getElementById('overlay');
                const title = document.getElementById('overlay-title');
                const desc = document.getElementById('overlay-desc');
                const btn = document.getElementById('start-btn');
                
                overlay.classList.remove('hidden');
                
                if (this.score >= this.targetScore) {
                    title.innerText = "关卡完成！";
                    title.className = "text-4xl font-bold mb-2 text-green-600";
                    desc.innerText = `得分: ${this.score} / 目标: ${this.targetScore}`;
                    btn.innerText = "下一关";
                    btn.onclick = () => {
                        this.level++;
                        this.startLevel();
                        overlay.classList.add('hidden');
                    };
                } else {
                    title.innerText = "游戏结束";
                    title.className = "text-4xl font-bold mb-2 text-red-600";
                    desc.innerText = `得分: ${this.score} 没达到目标 ${this.targetScore}`;
                    btn.innerText = "重新开始";
                    btn.onclick = () => {
                        this.startGame();
                    };
                }
            }

            updateUI() {
                document.getElementById('current-score').innerText = this.score;
                document.getElementById('target-score').innerText = this.targetScore;
                document.getElementById('level-display').innerText = this.level;
            }

            // 生成数学题
            generateQuiz(difficulty) {
                let a, b, op, ans;
                const ops = ['+', '-'];
                if (this.level > 2) ops.push('×');
                
                op = ops[Math.floor(Math.random() * ops.length)];
                
                if (op === '×') {
                    a = Math.floor(Math.random() * 9) + 1;
                    b = Math.floor(Math.random() * 9) + 1;
                    ans = a * b;
                } else if (op === '-') {
                    a = Math.floor(Math.random() * (this.level * 20)) + 5;
                    b = Math.floor(Math.random() * a);
                    ans = a - b;
                } else {
                    a = Math.floor(Math.random() * (this.level * 20));
                    b = Math.floor(Math.random() * (this.level * 20));
                    ans = a + b;
                }

                // 生成选项
                let options = [ans];
                while (options.length < 4) {
                    let offset = Math.floor(Math.random() * 10) - 5;
                    let fake = ans + offset;
                    if (fake >= 0 && !options.includes(fake)) {
                        options.push(fake);
                    }
                }
                // 打乱选项
                options.sort(() => Math.random() - 0.5);

                return {
                    question: `${a} ${op} ${b} = ?`,
                    answer: ans,
                    options: options
                };
            }

            showQuiz(item) {
                this.state = STATE.QUIZ;
                const modal = document.getElementById('quiz-modal');
                const qText = document.getElementById('question-text');
                const optContainer = document.getElementById('options-container');
                const timerBar = document.getElementById('quiz-timer-bar');
                
                const quiz = this.generateQuiz(this.level);
                qText.innerText = quiz.question;
                
                optContainer.innerHTML = '';
                quiz.options.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = "bg-gray-100 hover:bg-blue-100 text-gray-800 font-bold py-4 px-4 rounded-xl border-2 border-gray-200 text-xl transition-colors";
                    btn.innerText = opt;
                    btn.onclick = () => this.handleQuizAnswer(opt === quiz.answer, item);
                    optContainer.appendChild(btn);
                });

                modal.classList.remove('hidden');
                
                // 答题倒计时动画
                timerBar.style.width = '100%';
                anime({
                    targets: '#quiz-timer-bar',
                    width: '0%',
                    duration: 5000,
                    easing: 'linear',
                    complete: () => {
                        if (this.state === STATE.QUIZ) {
                            this.handleQuizAnswer(false, item);
                        }
                    }
                });
            }

            handleQuizAnswer(isCorrect, item) {
                const modal = document.getElementById('quiz-modal');
                modal.classList.add('hidden');
                anime.remove('#quiz-timer-bar'); // 停止倒计时
                
                if (isCorrect) {
                    this.playCorrectSound();
                    
                    // 根据物品类型设置回收速度
                    if (item.type === 'stone') {
                        // 石头：极慢回收（强化惩罚）
                        this.hook.speed = CONFIG.hookSpeed * 0.15; // 降低至 0.15 倍
                    } else if (item.type === 'bomb') {
                        // 炸药：正常速度但扣分
                        this.hook.speed = CONFIG.hookSpeed * 2.0;
                    } else {
                        // 其他：快速回收
                        this.hook.speed = CONFIG.hookSpeed * 3.0;
                    }
                    
                    // 计算得分
                    let earnedScore = 0;
                    if (item.score === 'BLIND_BOX') {
                        earnedScore = Math.floor(Math.random() * 999) + 1;
                        this.showFloatingText('+' + earnedScore, this.width/2, 100);
                    } else if (item.type === 'bomb') {
                        earnedScore = item.score; // -100
                        this.showFloatingText(earnedScore, this.width/2, 100);
                        this.createParticles(this.width/2, 100, 30, '#FF0000');
                    } else {
                        earnedScore = item.score;
                    }
                    
                    this.score += earnedScore;
                    if (item.type !== 'bomb') {
                        this.createParticles(this.width/2, 100, 20, null);
                    }
                } else {
                    this.playWrongSound();
                    // 答错：极慢拉回，且不得分（或者掉落）
                    this.hook.speed = 1; // 非常慢
                    // item.score = 0; // 不得分
                    // 或者直接让物品掉落，钩子空回
                    this.hook.grabbedItem = null;
                    this.hook.speed = CONFIG.hookSpeed * 2; // 快速空回
                }
                
                this.state = STATE.GRAB; // 继续拉回过程
                this.hook.status = 'REWIND';
                this.updateUI();
            }

            showFloatingText(text, x, y) {
                const el = document.createElement('div');
                el.className = 'fixed text-4xl font-bold text-yellow-300 pointer-events-none z-50';
                el.style.left = x + 'px';
                el.style.top = y + 'px';
                el.style.textShadow = '0 2px 4px rgba(0,0,0,0.5)';
                el.innerText = text;
                document.body.appendChild(el);

                anime({
                    targets: el,
                    translateY: -100,
                    opacity: 0,
                    duration: 1500,
                    easing: 'easeOutExpo',
                    complete: () => el.remove()
                });
            }

            createParticles(x, y, count, color = null) {
                for (let i = 0; i < count; i++) {
                    this.particles.push({
                        x: x,
                        y: y,
                        vx: (Math.random() - 0.5) * 10,
                        vy: (Math.random() - 0.5) * 10,
                        life: 1,
                        color: color || `hsl(${Math.random() * 60 + 30}, 100%, 50%)`
                    });
                }
            }

            update() {
                if (this.state === STATE.PAUSE || this.state === STATE.QUIZ) return;

                // 钩子逻辑
                if (this.hook.status === 'SWING') {
                    // 使用正弦函数实现丝滑摆动
                    this.swingTime += CONFIG.hookRotateSpeed;
                    this.hook.angle = Math.sin(this.swingTime) * CONFIG.hookMaxAngle;
                } else if (this.hook.status === 'SHOOT') {
                    this.hook.length += CONFIG.hookSpeed;
                    
                    // 实时计算钩子头部坐标
                    const hookX = this.hook.x + Math.sin(this.hook.angle) * this.hook.length;
                    const hookY = this.hook.y + Math.cos(this.hook.angle) * this.hook.length;

                    // 边界检测：严格限制在画面内
                    // 碰到左、右、下边界立即回收
                    if (hookX <= 0 || hookX >= this.width || hookY >= this.height) {
                        this.hook.status = 'REWIND';
                        this.hook.speed = CONFIG.hookSpeed * 5.0; // 空钩极速回
                    }

                    // 碰撞检测

                    for (let i = this.items.length - 1; i >= 0; i--) {
                        const item = this.items[i];
                        const dx = hookX - item.x;
                        const dy = hookY - item.y;
                        if (Math.sqrt(dx*dx + dy*dy) < item.radius) {
                            // 抓到了
                            this.hook.grabbedItem = item;
                            this.items.splice(i, 1);
                            
                            // 触发答题
                            this.showQuiz(item);
                            break;
                        }
                    }

                } else if (this.hook.status === 'REWIND') {
                    this.hook.length -= this.hook.speed;
                    if (this.hook.length <= CONFIG.ropeLength) {
                        this.hook.length = CONFIG.ropeLength;
                        this.hook.status = 'SWING';
                        this.state = STATE.IDLE;
                        if (this.hook.grabbedItem) {
                            // 已经加分了，这里只需清空
                            this.hook.grabbedItem = null;
                        }
                    }
                }

                // 粒子更新
                for (let i = this.particles.length - 1; i >= 0; i--) {
                    let p = this.particles[i];
                    p.x += p.vx;
                    p.y += p.vy;
                    p.life -= 0.02;
                    if (p.life <= 0) this.particles.splice(i, 1);
                }
            }

            draw() {
                this.ctx.clearRect(0, 0, this.width, this.height);

                // 绘制钩子绳索
                this.ctx.beginPath();
                this.ctx.moveTo(this.hook.x, this.hook.y);
                const endX = this.hook.x + Math.sin(this.hook.angle) * this.hook.length;
                const endY = this.hook.y + Math.cos(this.hook.angle) * this.hook.length;
                this.ctx.lineTo(endX, endY);
                this.ctx.lineWidth = 3;
                this.ctx.strokeStyle = '#333';
                this.ctx.stroke();

                // 绘制钩子头
                this.ctx.save();
                this.ctx.translate(endX, endY);
                this.ctx.rotate(-this.hook.angle);
                // 简单绘制钩子形状，或者使用图片
                if (this.assets.hook.complete) {
                    this.ctx.drawImage(this.assets.hook, -15, -10, 30, 30);
                } else {
                    this.ctx.fillStyle = '#555';
                    this.ctx.beginPath();
                    this.ctx.arc(0, 0, 10, 0, Math.PI*2);
                    this.ctx.fill();
                }
                
                // 如果抓住了物品，绘制物品在钩子上
                if (this.hook.grabbedItem) {
                    this.drawItem(this.hook.grabbedItem, 0, 15); // 相对坐标
                }
                this.ctx.restore();

                // 绘制场景中的物品
                this.items.forEach(item => {
                    this.ctx.save();
                    this.ctx.translate(item.x, item.y);
                    this.ctx.rotate(item.rotation);
                    this.drawItem(item, 0, 0);
                    this.ctx.restore();
                });

                // 绘制粒子
                this.particles.forEach(p => {
                    this.ctx.globalAlpha = p.life;
                    this.ctx.fillStyle = p.color;
                    this.ctx.beginPath();
                    this.ctx.arc(p.x, p.y, 5, 0, Math.PI*2);
                    this.ctx.fill();
                    this.ctx.globalAlpha = 1;
                });
            }

            drawItem(item, x, y) {
                const size = item.radius * 2;
                
                if (item.type === 'gold') {
                    if (this.assets.gold.complete) {
                        this.ctx.drawImage(this.assets.gold, x - item.radius, y - item.radius, size, size);
                    } else {
                        // Fallback
                        this.ctx.fillStyle = '#FFD54F';
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, item.radius, 0, Math.PI*2);
                        this.ctx.fill();
                    }
                } else if (item.type === 'stone') {
                    if (this.assets.stone.complete) {
                        this.ctx.drawImage(this.assets.stone, x - item.radius, y - item.radius, size, size);
                    } else {
                        this.ctx.fillStyle = '#9E9E9E';
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, item.radius, 0, Math.PI*2);
                        this.ctx.fill();
                    }
                } else if (item.type === 'bag') {
                    if (this.assets.bag.complete) {
                        this.ctx.drawImage(this.assets.bag, x - item.radius, y - item.radius, size, size);
                    } else {
                        this.ctx.fillStyle = '#EF5350';
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, item.radius, 0, Math.PI*2);
                        this.ctx.fill();
                        this.ctx.fillStyle = '#FFF';
                        this.ctx.fillText('?', x, y);
                    }
                } else if (item.type === 'bomb') {
                    if (this.assets.bomb.complete) {
                        this.ctx.drawImage(this.assets.bomb, x - item.radius, y - item.radius, size, size);
                    } else {
                        this.ctx.fillStyle = '#D32F2F';
                        this.ctx.beginPath();
                        this.ctx.arc(x, y, item.radius, 0, Math.PI*2);
                        this.ctx.fill();
                        this.ctx.fillStyle = '#FFF';
                        this.ctx.font = 'bold 20px Arial';
                        this.ctx.fillText('💣', x, y);
                    }
                } else if (item.type === 'diamond') {
                    // 钻石发光效果
                    this.ctx.save();
                    this.ctx.shadowColor = 'rgba(255, 255, 255, 0.8)';
                    this.ctx.shadowBlur = 20;
                    
                    this.ctx.fillStyle = CONFIG.colors.diamond[0];
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y - item.radius);
                    this.ctx.lineTo(x + item.radius, y);
                    this.ctx.lineTo(x, y + item.radius);
                    this.ctx.lineTo(x - item.radius, y);
                    this.ctx.closePath();
                    this.ctx.fill();
                    
                    // 内部高光
                    this.ctx.fillStyle = 'rgba(255, 255, 255, 0.6)';
                    this.ctx.beginPath();
                    this.ctx.moveTo(x, y - item.radius * 0.6);
                    this.ctx.lineTo(x + item.radius * 0.4, y - item.radius * 0.2);
                    this.ctx.lineTo(x, y);
                    this.ctx.lineTo(x - item.radius * 0.4, y - item.radius * 0.2);
                    this.ctx.fill();
                    
                    this.ctx.restore();
                    
                    // 随机闪烁
                    if (Math.random() > 0.9) {
                        this.ctx.fillStyle = 'white';
                        this.ctx.fillRect(x-2, y-2, 4, 4);
                    }
                }
            }

            loop() {
                this.update();
                this.draw();
                requestAnimationFrame(this.loop.bind(this));
            }
        }

        // 初始化
        window.onload = () => {
            const game = new Game();
        };
    </script>
