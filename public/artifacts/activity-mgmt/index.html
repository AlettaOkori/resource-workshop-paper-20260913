
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>课堂活动管理系统</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #A7DB9A 0%, #DCF5D9 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #F8F9F7;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header h1 {
            font-size: 36px;
            color: #102620;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .header p {
            font-size: 18px;
            color: #636D6A;
        }

        .nav-tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 30px;
            background: #DCF5D9;
            border-radius: 15px;
            padding: 8px;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-tab {
            padding: 12px 20px;
            background: transparent;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            color: #636D6A;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .nav-tab.active {
            background: #A7DB9A;
            color: #102620;
            transform: translateY(-2px);
        }

        .nav-tab:hover {
            background: #AACA9F;
            color: #102620;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .function-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #DCF5D9;
        }

        .function-card h3 {
            font-size: 24px;
            color: #102620;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background: #A7DB9A;
            color: #102620;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            margin: 5px;
        }

        .btn:hover {
            background: #004737;
            color: white;
            transform: translateY(-2px);
        }

        .btn:disabled {
            background: #636D6A;
            color: white;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: #FF6421;
            color: white;
        }

        .btn-secondary:hover {
            background: #FF9364;
        }

        .btn-warning {
            background: #FFDE5E;
            color: #102620;
        }

        .btn-warning:hover {
            background: #FFE98F;
        }

        .btn-success {
            background: #AACA9F;
            color: #102620;
        }

        .btn-success:hover {
            background: #004737;
            color: white;
        }

        .btn-danger {
            background: #FF2E26;
            color: white;
        }

        .btn-danger:hover {
            background: #FF5555;
        }

        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
            margin: 20px 0;
        }

        .student-card {
            background: #DCF5D9;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            color: #102620;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
        }

        .student-card:hover {
            background: #A7DB9A;
            transform: translateY(-2px);
        }

        .student-card.selected {
            background: #FF6421;
            color: white;
            border-color: #FF9364;
        }

        .student-card.present {
            background: #AACA9F;
            color: white;
        }

        .student-card.absent {
            background: #636D6A;
            color: white;
        }

        .student-score {
            background: #FF6421;
            color: white;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            position: absolute;
            top: -8px;
            right: -8px;
            box-shadow: 0 2px 8px rgba(255, 100, 33, 0.3);
        }

        .student-score.high {
            background: #004737;
        }

        .student-score.medium {
            background: #AACA9F;
        }

        /* 学生管理专用样式 */
        .student-manage-card {
            background: #DCF5D9;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            color: #102620;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .student-manage-card:hover {
            background: #A7DB9A;
            transform: translateY(-2px);
        }

        .student-manage-card .student-name {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .student-manage-card .student-actions {
            display: flex;
            gap: 5px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .student-manage-card:hover .student-actions {
            opacity: 1;
        }

        .btn-mini {
            padding: 4px 8px;
            font-size: 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-mini.edit {
            background: #FFDE5E;
            color: #102620;
        }

        .btn-mini.edit:hover {
            background: #FFE98F;
        }

        .btn-mini.delete {
            background: #FF2E26;
            color: white;
        }

        .btn-mini.delete:hover {
            background: #FF5555;
        }

        /* 添加学生表单样式 */
        .add-student-form {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid #A7DB9A;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 16px;
            color: #102620;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #DCF5D9;
            border-radius: 10px;
            font-size: 16px;
            color: #102620;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #A7DB9A;
            box-shadow: 0 0 0 3px rgba(167, 219, 154, 0.2);
        }

        .form-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        /* 模态框样式 */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            animation: modalFadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from { transform: translateY(-50px) scale(0.9); opacity: 0; }
            to { transform: translateY(0) scale(1); opacity: 1; }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #DCF5D9;
        }

        .modal-header h3 {
            color: #102620;
            font-size: 24px;
            margin: 0;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 28px;
            color: #636D6A;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #DCF5D9;
            color: #102620;
        }

        /* 滚动点名相关样式 */
        .random-container {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }

        .name-roller {
            background: white;
            border: 3px solid #A7DB9A;
            border-radius: 15px;
            padding: 30px;
            margin: 20px 0;
            height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            box-shadow: 0 5px 20px rgba(167, 219, 154, 0.3);
        }

        .rolling-name {
            font-size: 42px;
            font-weight: bold;
            color: #102620;
            transition: all 0.3s ease;
        }

        .rolling-name.rolling {
            animation: rollNames 0.08s linear infinite;
        }

        @keyframes rollNames {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            50% { transform: translateY(-20px) scale(0.9); opacity: 0.7; }
            100% { transform: translateY(-40px) scale(0.8); opacity: 0.3; }
        }

        .final-result {
            font-size: 48px;
            color: #FF6421;
            font-weight: bold;
            margin: 20px 0;
            padding: 30px;
            background: white;
            border-radius: 15px;
            border: 3px solid #FF6421;
            animation: resultAppear 0.8s ease-out;
            box-shadow: 0 10px 30px rgba(255, 100, 33, 0.3);
        }

        @keyframes resultAppear {
            0% { 
                opacity: 0; 
                transform: scale(0.5) rotate(-10deg); 
            }
            50% { 
                transform: scale(1.1) rotate(5deg); 
            }
            100% { 
                opacity: 1; 
                transform: scale(1) rotate(0deg); 
            }
        }

        .multi-result-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin: 20px 0;
        }

        .multi-result-item {
            background: white;
            border: 3px solid #FF6421;
            border-radius: 15px;
            padding: 20px;
            font-size: 24px;
            font-weight: bold;
            color: #FF6421;
            animation: multiResultAppear 0.6s ease-out;
            box-shadow: 0 5px 15px rgba(255, 100, 33, 0.2);
        }

        @keyframes multiResultAppear {
            0% { 
                opacity: 0; 
                transform: translateY(30px) scale(0.8); 
            }
            100% { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }

        .input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 10px 0;
            justify-content: center;
        }

        .input-group label {
            font-size: 16px;
            color: #102620;
            font-weight: 500;
        }

        .input-group input, .input-group select {
            padding: 8px 12px;
            border: 2px solid #DCF5D9;
            border-radius: 8px;
            font-size: 16px;
            width: 80px;
        }

        .group-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .group-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #DCF5D9;
        }

        .group-card h4 {
            font-size: 20px;
            color: #102620;
            margin-bottom: 15px;
            text-align: center;
            background: #A7DB9A;
            padding: 10px;
            border-radius: 10px;
        }

        .group-members {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .group-member {
            background: #DCF5D9;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            color: #102620;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #DCF5D9;
        }

        .stat-number {
            font-size: 36px;
            font-weight: bold;
            color: #FF6421;
            margin-bottom: 10px;
        }

        .stat-label {
            font-size: 16px;
            color: #636D6A;
        }

        /* 积分系统样式 */
        .score-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .score-card {
            background: white;
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 2px solid #DCF5D9;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .score-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .score-card.selected {
            border-color: #FF6421;
            background: #FFF5F0;
        }

        .score-card .student-name {
            font-size: 16px;
            font-weight: bold;
            color: #102620;
            margin-bottom: 8px;
        }

        .score-card .student-points {
            font-size: 24px;
            font-weight: bold;
            color: #FF6421;
            margin-bottom: 5px;
        }

        .score-card .points-label {
            font-size: 12px;
            color: #636D6A;
        }

        .rank-badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #004737;
            color: white;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0, 71, 55, 0.3);
        }

        .rank-badge.gold {
            background: linear-gradient(45deg, #FFD700, #FFA500);
        }

        .rank-badge.silver {
            background: linear-gradient(45deg, #C0C0C0, #A0A0A0);
        }

        .rank-badge.bronze {
            background: linear-gradient(45deg, #CD7F32, #B8860B);
        }

        .score-actions {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .score-input-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 15px 0;
            justify-content: center;
            flex-wrap: wrap;
        }

        .leaderboard {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin: 20px 0;
            border: 2px solid #DCF5D9;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            padding: 15px;
            margin: 10px 0;
            background: #F8F9F7;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .leaderboard-item:hover {
            background: #DCF5D9;
            transform: translateX(5px);
        }

        .leaderboard-rank {
            font-size: 24px;
            font-weight: bold;
            color: #FF6421;
            width: 50px;
            text-align: center;
        }

        .leaderboard-rank.top3 {
            color: #004737;
        }

        .leaderboard-name {
            flex: 1;
            font-size: 18px;
            color: #102620;
            font-weight: 500;
            margin-left: 15px;
        }

        .leaderboard-score {
            font-size: 20px;
            font-weight: bold;
            color: #FF6421;
            background: #DCF5D9;
            padding: 8px 15px;
            border-radius: 20px;
        }

        .score-animation {
            animation: scoreIncrease 0.6s ease-out;
        }

        @keyframes scoreIncrease {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #004737; }
            100% { transform: scale(1); }
        }

        .selected-students-display {
            background: #FFF5F0;
            border: 2px solid #FF6421;
            border-radius: 15px;
            padding: 20px;
            margin: 20px 0;
            text-align: center;
        }

        .selected-students-display h4 {
            color: #FF6421;
            margin-bottom: 15px;
            font-size: 18px;
        }

        .selected-student-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }

        .selected-student-tag {
            background: #FF6421;
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
        }

        /* 数据状态指示器 */
        .data-status {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #004737;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .data-status.show {
            opacity: 1;
        }

        .data-status.success {
            background: #AACA9F;
            color: #102620;
        }

        .data-status.error {
            background: #FF6421;
            color: white;
        }

        /* 学生统计信息 */
        .student-stats {
            background: #F8F9F7;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            border: 2px solid #DCF5D9;
            text-align: center;
        }

        .student-stats h4 {
            color: #102620;
            margin-bottom: 15px;
            font-size: 20px;
        }

        .stats-row {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .stat-item .number {
            font-size: 32px;
            font-weight: bold;
            color: #FF6421;
            margin-bottom: 5px;
        }

        .stat-item .label {
            font-size: 14px;
            color: #636D6A;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .header h1 {
                font-size: 28px;
            }
            
            .nav-tabs {
                flex-wrap: wrap;
            }
            
            .nav-tab {
                padding: 10px 16px;
                font-size: 14px;
            }
            
            .student-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            }
            
            .final-result {
                font-size: 32px;
                padding: 20px;
            }

            .name-roller {
                height: 120px;
                padding: 20px;
            }

            .rolling-name {
                font-size: 32px;
            }

            .score-grid {
                grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            }

            .controls {
                justify-content: center;
            }

            .score-actions {
                justify-content: center;
            }

            .data-status {
                top: 10px;
                right: 10px;
                font-size: 12px;
                padding: 6px 12px;
            }

            .modal-content {
                width: 95%;
                padding: 20px;
            }

            .form-actions {
                justify-content: center;
            }

            .stats-row {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>课堂活动管理系统</h1>
            <p>智能化课堂管理，让教学更高效</p>
        </div>

        <!-- 数据状态指示器 -->
        <div id="dataStatus" class="data-status"></div>

        <div class="nav-tabs">
            <button class="nav-tab active" onclick="switchTab('random')">随机点名</button>
            <button class="nav-tab" onclick="switchTab('students')">学生管理</button>
            <button class="nav-tab" onclick="switchTab('scores')">积分管理</button>
            <button class="nav-tab" onclick="switchTab('group')">分组管理</button>
            <button class="nav-tab" onclick="switchTab('attendance')">考勤管理</button>
            <button class="nav-tab" onclick="switchTab('stats')">数据统计</button>
        </div>

        <!-- 随机点名 -->
        <div id="random" class="tab-content active">
            <div class="function-card">
                <h3>🎯 滚动随机点名</h3>

                <div class="controls">
                    <button class="btn" id="startBtn" onclick="startRandomSelect()">开始点名</button>
                    <button class="btn btn-secondary" onclick="multiRandomSelect()">多人点名</button>
                    <button class="btn btn-warning" onclick="resetSelection()">重置选择</button>
                </div>
                
                <div class="input-group">
                    <label>点名人数：</label>
                    <input type="number" id="selectCount" value="1" min="1" max="5">
                </div>

                <div class="random-container">
                    <!-- 滚动模式 -->
                    <div class="name-roller">
                        <div class="rolling-name" id="rollingName">准备开始</div>
                    </div>

                    <!-- 结果显示区域 -->
                    <div id="resultArea"></div>
                </div>

                <div class="student-grid" id="studentGrid"></div>
            </div>
        </div>

        <!-- 学生管理 -->
        <div id="students" class="tab-content">
            <div class="function-card">
                <h3>👥 学生管理</h3>
                
                <!-- 学生统计信息 -->
                <div class="student-stats">
                    <h4>班级概况</h4>
                    <div class="stats-row">
                        <div class="stat-item">
                            <div class="number" id="totalStudentsCount">0</div>
                            <div class="label">总人数</div>
                        </div>
                        <div class="stat-item">
                            <div class="number" id="maleStudentsCount">0</div>
                            <div class="label">男生</div>
                        </div>

    <script>

        let selectedScoreStudents = [];

        let currentEditingStudent = null;

        // 数据存储键名
        const STORAGE_KEYS = {

            GROUPS: 'classroom_groups_data'
        };

        // 初始学生数据
        const initialStudents = [
            { name: '冯文希', gender: '未知' },
            { name: '徐梦轩', gender: '未知' },

            { name: '高显万', gender: '未知' },

            { name: '李婷梦', gender: '未知' },
            { name: '刘苏苏', gender: '未知' },

            { name: '谌俊佑', gender: '未知' },
            { name: '李子逸然', gender: '未知' },
            { name: '李燕', gender: '未知' },
            { name: '徐宇杰', gender: '未知' },
            { name: '李梦婷', gender: '未知' },
            { name: '张伊航', gender: '未知' },
            { name: '王晨宇', gender: '未知' },
            { name: '徐锦鹏', gender: '未知' },
            { name: '杨国心', gender: '未知' },
            { name: '岳雨珊', gender: '未知' }
        ];

        // 数据状态提示
        function showDataStatus(message, type = 'success') {
            const statusElement = document.getElementById('dataStatus');
            statusElement.textContent = message;
            statusElement.className = `data-status ${type} show`;
            
            setTimeout(() => {
                statusElement.classList.remove('show');
            }, 2000);
        }

        // 保存数据到localStorage
        function saveData(key, data) {
            try {
                localStorage.setItem(key, JSON.stringify(data));
                return true;
            } catch (error) {
                console.error('保存数据失败:', error);
                showDataStatus('数据保存失败', 'error');
                return false;
            }
        }

        // 从localStorage加载数据
        function loadData(key, defaultValue = {}) {
            try {
                const data = localStorage.getItem(key);
                return data ? JSON.parse(data) : defaultValue;
            } catch (error) {
                console.error('加载数据失败:', error);
                showDataStatus('数据加载失败', 'error');
                return defaultValue;
            }
        }

        // 保存学生数据
        function saveStudentsData() {
            const success = saveData(STORAGE_KEYS.STUDENTS, students);
            if (success) {
                showDataStatus('学生数据已保存');
            }
        }

        // 保存积分数据
        function saveScoreData() {
            const success = saveData(STORAGE_KEYS.SCORES, studentScores);
            if (success) {
                showDataStatus('积分数据已保存');
            }
        }

        // 保存积分历史
        function saveScoreHistory() {
            saveData(STORAGE_KEYS.HISTORY, scoreHistory);
        }

        // 保存考勤数据
        function saveAttendanceData() {
            const success = saveData(STORAGE_KEYS.ATTENDANCE, attendanceData);
            if (success) {
                showDataStatus('考勤数据已保存');
            }
        }

        // 保存分组数据
        function saveGroupsData() {
            const success = saveData(STORAGE_KEYS.GROUPS, groups);
            if (success) {
                showDataStatus('分组数据已保存');
            }
        }

        // 获取学生姓名列表
        function getStudentNames() {
            return students.map(student => student.name);
        }

        // 初始化学生数据
        function initStudents() {
            const savedStudents = loadData(STORAGE_KEYS.STUDENTS, []);
            
            if (savedStudents.length > 0) {
                students = savedStudents;
                showDataStatus('学生数据加载成功');
            } else {
                students = [...initialStudents];
                saveStudentsData();
            }
        }

        // 初始化积分数据
        function initScores() {
            const savedScores = loadData(STORAGE_KEYS.SCORES, {});
            const savedHistory = loadData(STORAGE_KEYS.HISTORY, []);
            
            studentScores = {};
            getStudentNames().forEach(name => {
                studentScores[name] = savedScores[name] || 0;
            });
            
            scoreHistory = savedHistory;
            
            if (Object.keys(savedScores).length > 0) {
                showDataStatus('积分数据加载成功');
            }
        }

        // 初始化考勤数据
        function initAttendance() {
            const savedAttendance = loadData(STORAGE_KEYS.ATTENDANCE, {});
            attendanceData = savedAttendance;
            
            if (Object.keys(savedAttendance).length > 0) {
                showDataStatus('考勤数据加载成功');
            }
        }

        // 初始化分组数据
        function initGroups() {
            const savedGroups = loadData(STORAGE_KEYS.GROUPS, []);
            groups = savedGroups;
            
            if (savedGroups.length > 0) {
                showDataStatus('分组数据加载成功');
                renderGroups();
            }
        }

        // 添加新学生
        function addNewStudent() {
            const nameInput = document.getElementById('newStudentName');
            const genderSelect = document.getElementById('studentGender');
            const name = nameInput.value.trim();
            const gender = genderSelect.value;
            
            if (!name) {
                alert('请输入学生姓名！');
                nameInput.focus();
                return;
            }
            
            if (getStudentNames().includes(name)) {
                alert('该学生已存在！');
                nameInput.focus();
                return;
            }
            
            // 添加学生
            students.push({ name: name, gender: gender });
            
            // 初始化该学生的积分
            studentScores[name] = 0;
            
            // 保存数据
            saveStudentsData();
            saveScoreData();
            
            // 清空输入框
            nameInput.value = '';
            genderSelect.value = '未知';
            
            // 刷新所有相关界面
            refreshAllGrids();
            updateStats();
            updateStudentStats();
            
            showDataStatus(`学生 "${name}" 添加成功`);
        }

        // 编辑学生
        function editStudent(index) {
            const student = students[index];
            currentEditingStudent = index;
            
            document.getElementById('editStudentName').value = student.name;
            document.getElementById('editStudentGender').value = student.gender;
            
            document.getElementById('editStudentModal').classList.add('show');
        }

        // 保存学生编辑
        function saveStudentEdit() {
            if (currentEditingStudent === null) return;
            
            const nameInput = document.getElementById('editStudentName');
            const genderSelect = document.getElementById('editStudentGender');
            const newName = nameInput.value.trim();
            const newGender = genderSelect.value;
            
            if (!newName) {
                alert('请输入学生姓名！');
                nameInput.focus();
                return;
            }
            
            const oldName = students[currentEditingStudent].name;
            
            // 检查是否与其他学生重名
            if (newName !== oldName && getStudentNames().includes(newName)) {
                alert('该学生姓名已存在！');
                nameInput.focus();
                return;
            }
            
            // 更新学生信息
            students[currentEditingStudent] = { name: newName, gender: newGender };
            
            // 如果姓名发生变化，需要更新相关数据
            if (newName !== oldName) {
                // 更新积分数据
                if (studentScores[oldName] !== undefined) {
                    studentScores[newName] = studentScores[oldName];
                    delete studentScores[oldName];
                }
                
                // 更新考勤数据
                if (attendanceData[oldName] !== undefined) {
                    attendanceData[newName] = attendanceData[oldName];
                    delete attendanceData[oldName];
                }
                
                // 更新积分历史
                scoreHistory.forEach(record => {
                    if (record.student === oldName) {
                        record.student = newName;
                    }
                });
                
                // 更新选中学生列表
                const selectedIndex = selectedScoreStudents.indexOf(oldName);
                if (selectedIndex !== -1) {
                    selectedScoreStudents[selectedIndex] = newName;
                }
            }
            
            // 保存所有相关数据
            saveStudentsData();
            saveScoreData();
            saveAttendanceData();
            saveScoreHistory();
            
            // 刷新界面
            refreshAllGrids();
            updateStats();
            updateStudentStats();
            updateLeaderboard();
            updateSelectedStudentsDisplay();
            
            closeEditModal();
            showDataStatus(`学生信息修改成功`);
        }

        // 删除学生
        function deleteStudent(index) {
            const student = students[index];
            
            if (confirm(`确定要删除学生 "${student.name}" 吗？\n删除后将清除该学生的所有相关数据（积分、考勤等）！`)) {
                const studentName = student.name;
                
                // 从学生列表中删除
                students.splice(index, 1);
                
                // 清除相关数据
                delete studentScores[studentName];
                delete attendanceData[studentName];
                
                // 从选中列表中移除
                selectedScoreStudents = selectedScoreStudents.filter(name => name !== studentName);
                selectedStudents = selectedStudents.filter(name => name !== studentName);
                
                // 清除积分历史中的记录
                scoreHistory = scoreHistory.filter(record => record.student !== studentName);
                
                // 保存数据
                saveStudentsData();
                saveScoreData();
                saveAttendanceData();
                saveScoreHistory();
                
                // 刷新界面
                refreshAllGrids();
                updateStats();
                updateStudentStats();
                updateLeaderboard();
                updateSelectedStudentsDisplay();
                
                showDataStatus(`学生 "${studentName}" 已删除`);
            }
        }

        // 批量导入学生
        function importStudents() {
            document.getElementById('importStudentsModal').classList.add('show');
        }

        // 确认批量导入
        function confirmImportStudents() {
            const textarea = document.getElementById('importStudentList');
            const nameList = textarea.value.trim().split('\n').filter(name => name.trim());
            
            if (nameList.length === 0) {
                alert('请输入学生姓名！');
                return;
            }
            
            let addedCount = 0;
            let duplicateCount = 0;
            
            nameList.forEach(name => {
                const trimmedName = name.trim();
                if (trimmedName && !getStudentNames().includes(trimmedName)) {
                    students.push({ name: trimmedName, gender: '未知' });
                    studentScores[trimmedName] = 0;
                    addedCount++;
                } else if (trimmedName) {
                    duplicateCount++;
                }
            });
            
            if (addedCount > 0) {
                saveStudentsData();
                saveScoreData();
                refreshAllGrids();
                updateStats();
                updateStudentStats();
            }
            
            closeImportModal();
            
            let message = `成功导入 ${addedCount} 名学生`;
            if (duplicateCount > 0) {
                message += `，跳过 ${duplicateCount} 个重复姓名`;
            }
            showDataStatus(message);
        }

        // 导出学生名单
        function exportStudentList() {
            const date = new Date().toLocaleDateString();
            let report = `学生名单 - ${date}\n\n`;
            
            report += `总人数：${students.length}人\n\n`;
            
            const maleCount = students.filter(s => s.gender === '男').length;
            const femaleCount = students.filter(s => s.gender === '女').length;
            const unknownCount = students.filter(s => s.gender === '未知').length;
            
            report += `性别统计：\n`;
            report += `男生：${maleCount}人\n`;
            report += `女生：${femaleCount}人\n`;
            report += `未知：${unknownCount}人\n\n`;
            
            report += `学生名单：\n`;
            students.forEach((student, index) => {
                report += `${index + 1}. ${student.name}（${student.gender}）\n`;
            });
            
            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `学生名单_${date.replace(/\//g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showDataStatus('学生名单导出成功');
        }

        // 清空所有学生
        function clearAllStudents() {
            if (confirm('确定要清空所有学生吗？\n此操作将删除所有学生及其相关数据（积分、考勤等），且不可撤销！')) {
                students = [];
                studentScores = {};
                attendanceData = {};
                scoreHistory = [];
                selectedStudents = [];
                selectedScoreStudents = [];
                groups = [];
                
                // 保存清空后的数据
                saveStudentsData();
                saveScoreData();
                saveAttendanceData();
                saveScoreHistory();
                saveGroupsData();
                
                // 刷新界面
                refreshAllGrids();
                updateStats();
                updateStudentStats();
                updateLeaderboard();
                updateSelectedStudentsDisplay();
                
                showDataStatus('所有学生数据已清空');
            }
        }

        // 更新学生统计信息
        function updateStudentStats() {
            const total = students.length;
            const male = students.filter(s => s.gender === '男').length;
            const female = students.filter(s => s.gender === '女').length;
            
            document.getElementById('totalStudentsCount').textContent = total;
            document.getElementById('maleStudentsCount').textContent = male;
            document.getElementById('femaleStudentsCount').textContent = female;
        }

        // 关闭编辑模态框
        function closeEditModal() {
            document.getElementById('editStudentModal').classList.remove('show');
            currentEditingStudent = null;

            document.getElementById('importStudentsModal').classList.remove('show');
            document.getElementById('importStudentList').value = '';

        function refreshAllGrids() {
            renderStudentGrid();
            renderStudentManageGrid();
            renderAttendanceGrid();
            renderScoreGrid();

        // 渲染学生管理网格
        function renderStudentManageGrid() {
            const grid = document.getElementById('studentManageGrid');
            grid.innerHTML = '';
            
            students.forEach((student, index) => {
                const card = document.createElement('div');
                card.className = 'student-manage-card';
                
                const name = document.createElement('div');
                name.className = 'student-name';
                name.textContent = student.name;
                
                const gender = document.createElement('div');
                gender.style.fontSize = '12px';
                gender.style.color = '#636D6A';
                gender.textContent = student.gender;
                
                const actions = document.createElement('div');
                actions.className = 'student-actions';
                
                const editBtn = document.createElement('button');
                editBtn.className = 'btn-mini edit';
                editBtn.textContent = '编辑';
                editBtn.onclick = (e) => {
                    e.stopPropagation();
                    editStudent(index);
                };
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'btn-mini delete';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteStudent(index);
                };
                
                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);
                
                card.appendChild(name);
                card.appendChild(gender);
                card.appendChild(actions);
                
                grid.appendChild(card);
            });
        }

        // 初始化
        function init() {
            initStudents();
            initScores();
            initAttendance();
            initGroups();
            renderStudentGrid();
            renderStudentManageGrid();
            renderAttendanceGrid();
            renderScoreGrid();
            updateStats();
            updateStudentStats();
            updateLeaderboard();
            
            setTimeout(() => {
                showDataStatus('系统初始化完成');
            }, 500);
        }

        // 切换标签页
        function switchTab(tabName) {
            document.querySelectorAll('.nav-tab').forEach(tab => tab.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tabName).classList.add('active');
        }

        // 开始随机选择
        function startRandomSelect() {
            if (isSelecting) return;
            
            const studentNames = getStudentNames();
            const availableStudents = studentNames.filter(s => !selectedStudents.includes(s));
            if (availableStudents.length === 0) {
                alert('所有学生都已被选中，请重置选择！');
                return;
            }

            isSelecting = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('resultArea').innerHTML = '';

            startRollerSelection(availableStudents);
        }

        // 滚动选择
        function startRollerSelection(availableStudents) {
            const rollingName = document.getElementById('rollingName');
            let currentIndex = 0;
            let speed = 80;
            let slowDown = false;
            let iterations = 0;
            
            rollingName.classList.add('rolling');
            
            const rollInterval = setInterval(() => {
                rollingName.textContent = availableStudents[currentIndex];
                currentIndex = (currentIndex + 1) % availableStudents.length;
                iterations++;
                
                if (iterations > 30 && !slowDown) {
                    slowDown = true;
                }
                
                if (slowDown) {
                    speed += 25;
                    if (speed > 600) {
                        clearInterval(rollInterval);
                        
                        rollingName.classList.remove('rolling');
                        
                        const selectedStudent = availableStudents[Math.floor(Math.random() * availableStudents.length)];
                        rollingName.textContent = selectedStudent;
                        
                        setTimeout(() => {
                            showResult(selectedStudent);
                            selectedStudents.push(selectedStudent);
                            updateStudentGridDisplay();
                            isSelecting = false;
                            document.getElementById('startBtn').disabled = false;
                        }, 800);
                    }
                }
            }, speed);
        }

        // 显示结果
        function showResult(student) {
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = `<div class="final-result">🎉 ${student} 🎉</div>`;
        }

        // 多人点名
        function multiRandomSelect() {
            if (isSelecting) return;
            
            const count = parseInt(document.getElementById('selectCount').value);
            const studentNames = getStudentNames();
            const availableStudents = studentNames.filter(s => !selectedStudents.includes(s));
            
            if (availableStudents.length < count) {
                alert(`可选学生不足${count}人，请重置选择或减少点名人数！`);
                return;
            }

            isSelecting = true;
            document.getElementById('startBtn').disabled = true;
            document.getElementById('resultArea').innerHTML = '';

            const rollingName = document.getElementById('rollingName');
            rollingName.classList.add('rolling');
            
            let rollCount = 0;
            const rollInterval = setInterval(() => {
                const randomStudent = availableStudents[Math.floor(Math.random() * availableStudents.length)];
                rollingName.textContent = randomStudent;
                rollCount++;
                
                if (rollCount > 20) {
                    clearInterval(rollInterval);
                    rollingName.classList.remove('rolling');
                    
                    setTimeout(() => {
                        performMultiSelection(availableStudents, count);
                    }, 500);
                }
            }, 100);
        }

        // 执行多人选择
        function performMultiSelection(availableStudents, count) {
            let selectedCount = 0;
            const selected = [];
            const tempAvailable = [...availableStudents];
            
            const selectNext = () => {
                if (selectedCount < count) {
                    const randomIndex = Math.floor(Math.random() * tempAvailable.length);
                    const selectedStudent = tempAvailable.splice(randomIndex, 1)[0];
                    selected.push(selectedStudent);
                    selectedStudents.push(selectedStudent);
                    selectedCount++;
                    
                    updateMultiResult(selected);
                    
                    setTimeout(selectNext, 800);
                } else {
                    updateStudentGridDisplay();
                    isSelecting = false;
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('rollingName').textContent = '准备开始';
                }
            };
            
            selectNext();
        }

        // 更新多人结果显示
        function updateMultiResult(selected) {
            const resultArea = document.getElementById('resultArea');
            const container = document.createElement('div');
            container.className = 'multi-result-container';
            
            selected.forEach((student, index) => {
                const item = document.createElement('div');
                item.className = 'multi-result-item';
                item.textContent = student;
                item.style.animationDelay = `${index * 0.1}s`;
                container.appendChild(item);
            });
            
            resultArea.innerHTML = '';
            resultArea.appendChild(container);
        }

        // 重置选择
        function resetSelection() {
            selectedStudents = [];
            document.getElementById('resultArea').innerHTML = '';
            document.getElementById('rollingName').textContent = '准备开始';
            document.getElementById('rollingName').classList.remove('rolling');
            updateStudentGridDisplay();
        }

        // 渲染学生网格（随机点名页面）
        function renderStudentGrid() {
            const grid = document.getElementById('studentGrid');
            grid.innerHTML = '';
            
            getStudentNames().forEach(name => {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.textContent = name;
                card.onclick = () => toggleStudentSelection(name, card);
                
                grid.appendChild(card);
            });
        }

        // 切换学生选择状态
        function toggleStudentSelection(student, card) {
            if (selectedStudents.includes(student)) {
                selectedStudents = selectedStudents.filter(s => s !== student);
                card.classList.remove('selected');
            } else {
                selectedStudents.push(student);
                card.classList.add('selected');
            }
        }

        // 更新学生网格显示
        function updateStudentGridDisplay() {
            const cards = document.querySelectorAll('#studentGrid .student-card');
            cards.forEach(card => {
                const student = card.textContent.trim();
                if (selectedStudents.includes(student)) {
                    card.classList.add('selected');
                } else {
                    card.classList.remove('selected');
                }
            });
        }

        // 渲染积分网格
        function renderScoreGrid() {
            const grid = document.getElementById('scoreGrid');
            grid.innerHTML = '';
            
            const studentNames = getStudentNames();
            const sortedStudents = [...studentNames].sort((a, b) => (studentScores[b] || 0) - (studentScores[a] || 0));
            
            sortedStudents.forEach((name, index) => {
                const card = document.createElement('div');
                card.className = 'score-card';
                card.onclick = () => toggleScoreStudentSelection(name, card);
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'student-name';
                nameDiv.textContent = name;
                
                const points = document.createElement('div');
                points.className = 'student-points';
                points.textContent = studentScores[name] || 0;
                
                const label = document.createElement('div');
                label.className = 'points-label';
                label.textContent = '积分';
                
                card.appendChild(nameDiv);
                card.appendChild(points);
                card.appendChild(label);
                
                if (index < 3 && (studentScores[name] || 0) > 0) {
                    const badge = document.createElement('div');
                    badge.className = 'rank-badge';
                    if (index === 0) badge.classList.add('gold');
                    else if (index === 1) badge.classList.add('silver');
                    else if (index === 2) badge.classList.add('bronze');
                    badge.textContent = index + 1;
                    card.appendChild(badge);
                }
                
                grid.appendChild(card);
            });
        }

        // 切换积分学生选择状态
        function toggleScoreStudentSelection(student, card) {
            if (selectedScoreStudents.includes(student)) {
                selectedScoreStudents = selectedScoreStudents.filter(s => s !== student);
                card.classList.remove('selected');
            } else {
                selectedScoreStudents.push(student);
                card.classList.add('selected');
            }
            updateSelectedStudentsDisplay();
        }

        // 更新选中学生显示
        function updateSelectedStudentsDisplay() {
            const display = document.getElementById('selectedStudentsDisplay');
            const tags = document.getElementById('selectedStudentTags');
            
            if (selectedScoreStudents.length > 0) {
                display.style.display = 'block';
                tags.innerHTML = '';
                selectedScoreStudents.forEach(student => {
                    const tag = document.createElement('div');
                    tag.className = 'selected-student-tag';
                    tag.textContent = student;
                    tags.appendChild(tag);
                });
            } else {
                display.style.display = 'none';
            }
        }

        // 为选中学生加分
        function addScoreToSelected() {
            if (selectedScoreStudents.length === 0) {
                alert('请先选择学生！');
                return;
            }
            
            const scoreValue = parseInt(document.getElementById('scoreValue').value);
            const reason = document.getElementById('scoreReason').value;
            
            selectedScoreStudents.forEach(student => {
                studentScores[student] = (studentScores[student] || 0) + scoreValue;
                
                scoreHistory.push({
                    student: student,
                    score: scoreValue,
                    reason: reason,
                    timestamp: new Date().toLocaleString(),
                    type: 'add'
                });
            });
            
            saveScoreData();
            saveScoreHistory();
            
            animateScoreChange();
            
            renderScoreGrid();
            updateLeaderboard();
            updateStats();
            
            alert(`已为 ${selectedScoreStudents.join('、')} 加 ${scoreValue} 分！`);
        }

        // 为选中学生减分
        function subtractScoreFromSelected() {
            if (selectedScoreStudents.length === 0) {
                alert('请先选择学生！');
                return;
            }
            
            const scoreValue = parseInt(document.getElementById('scoreValue').value);
            const reason = document.getElementById('scoreReason').value;
            
            selectedScoreStudents.forEach(student => {
                studentScores[student] = Math.max(0, (studentScores[student] || 0) - scoreValue);
                
                scoreHistory.push({
                    student: student,
                    score: -scoreValue,
                    reason: reason,
                    timestamp: new Date().toLocaleString(),
                    type: 'subtract'
                });
            });
            
            saveScoreData();
            saveScoreHistory();
            
            renderScoreGrid();
            updateLeaderboard();
            updateStats();
            
            alert(`已为 ${selectedScoreStudents.join('、')} 减 ${scoreValue} 分！`);
        }

        // 积分变化动画
        function animateScoreChange() {
            selectedScoreStudents.forEach(student => {
                const cards = document.querySelectorAll('.score-card');
                cards.forEach(card => {
                    const nameElement = card.querySelector('.student-name');
                    if (nameElement && nameElement.textContent === student) {
                        const pointsElement = card.querySelector('.student-points');
                        pointsElement.classList.add('score-animation');
                        setTimeout(() => {
                            pointsElement.classList.remove('score-animation');
                        }, 600);
                    }
                });
            });
        }

        // 清空选择
        function clearSelectedStudents() {
            selectedScoreStudents = [];
            document.querySelectorAll('.score-card').forEach(card => {
                card.classList.remove('selected');
            });
            updateSelectedStudentsDisplay();
        }

        // 重置所有积分
        function resetAllScores() {
            if (confirm('确定要重置所有学生的积分吗？此操作不可撤销！')) {
                getStudentNames().forEach(name => {
                    studentScores[name] = 0;
                });
                scoreHistory = [];
                
                saveScoreData();
                saveScoreHistory();
                
                renderScoreGrid();
                updateLeaderboard();
                updateStats();
                alert('所有积分已重置！');
            }
        }

        // 导出积分数据
        function exportScoreData() {
            const date = new Date().toLocaleDateString();
            let report = `积分统计报告 - ${date}\n\n`;
            
            const studentNames = getStudentNames();
            const sortedStudents = [...studentNames].sort((a, b) => (studentScores[b] || 0) - (studentScores[a] || 0));
            
            report += '积分排行榜：\n';
            sortedStudents.forEach((student, index) => {
                const score = studentScores[student] || 0;
                if (score > 0) {
                    report += `${index + 1}. ${student} - ${score}分\n`;
                }
            });
            
            report += '\n积分历史记录：\n';
            scoreHistory.forEach(record => {
                const action = record.type === 'add' ? '加分' : '减分';
                report += `${record.timestamp} - ${record.student} ${action} ${Math.abs(record.score)}分 (${record.reason})\n`;
            });
            
            const totalScores = Object.values(studentScores).reduce((sum, score) => sum + (score || 0), 0);
            const averageScore = studentNames.length > 0 ? (totalScores / studentNames.length).toFixed(1) : 0;
            
            report += `\n统计数据：\n`;
            report += `总积分：${totalScores}分\n`;
            report += `平均积分：${averageScore}分\n`;
            report += `参与学生：${sortedStudents.filter(s => (studentScores[s] || 0) > 0).length}人\n`;
            
            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `积分统计报告_${date.replace(/\//g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showDataStatus('积分数据导出成功');
        }

        // 更新排行榜
        function updateLeaderboard() {
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = '';
            
            const studentNames = getStudentNames();
            const sortedStudents = [...studentNames]
                .filter(name => (studentScores[name] || 0) > 0)
                .sort((a, b) => (studentScores[b] || 0) - (studentScores[a] || 0));
            
            if (sortedStudents.length === 0) {
                leaderboard.innerHTML = '<p style="text-align: center; color: #636D6A; font-size: 18px;">暂无积分记录</p>';
                return;
            }
            
            sortedStudents.forEach((student, index) => {
                const item = document.createElement('div');
                item.className = 'leaderboard-item';
                
                const rank = document.createElement('div');
                rank.className = 'leaderboard-rank';
                if (index < 3) rank.classList.add('top3');
                rank.textContent = index + 1;
                
                const name = document.createElement('div');
                name.className = 'leaderboard-name';
                name.textContent = student;
                
                const score = document.createElement('div');
                score.className = 'leaderboard-score';
                score.textContent = `${studentScores[student]} 分`;
                
                item.appendChild(rank);
                item.appendChild(name);
                item.appendChild(score);
                
                leaderboard.appendChild(item);
            });
        }

        // 随机分组
        function randomGroup() {
            const groupSize = parseInt(document.getElementById('groupSize').value);
            const studentNames = getStudentNames();
            const shuffled = [...studentNames].sort(() => Math.random() - 0.5);
            
            groups = [];
            for (let i = 0; i < shuffled.length; i += groupSize) {
                groups.push(shuffled.slice(i, i + groupSize));
            }
            
            saveGroupsData();
            renderGroups();
        }

        // 渲染分组
        function renderGroups() {
            const container = document.getElementById('groupContainer');
            container.innerHTML = '';
            
            groups.forEach((group, index) => {
                const groupCard = document.createElement('div');
                groupCard.className = 'group-card';
                
                const title = document.createElement('h4');
                title.textContent = `第${index + 1}组`;
                groupCard.appendChild(title);
                
                const members = document.createElement('div');
                members.className = 'group-members';
                
                group.forEach(student => {
                    const member = document.createElement('div');
                    member.className = 'group-member';
                    member.textContent = student;
                    members.appendChild(member);
                });
                
                groupCard.appendChild(members);
                container.appendChild(groupCard);
            });
        }

        // 清空分组
        function clearGroups() {
            groups = [];
            saveGroupsData();
            document.getElementById('groupContainer').innerHTML = '';
        }

        // 渲染考勤网格
        function renderAttendanceGrid() {
            const grid = document.getElementById('attendanceGrid');
            grid.innerHTML = '';
            
            getStudentNames().forEach(name => {
                const card = document.createElement('div');
                card.className = 'student-card';
                card.textContent = name;
                card.onclick = () => toggleAttendance(name, card);
                
                if (attendanceData[name] === 'present') {
                    card.classList.add('present');
                } else if (attendanceData[name] === 'absent') {
                    card.classList.add('absent');
                }
                
                grid.appendChild(card);
            });
        }

        // 切换考勤状态
        function toggleAttendance(student, card) {
            if (!attendanceData[student]) {
                attendanceData[student] = 'present';
                card.classList.add('present');
                card.classList.remove('absent');
            } else if (attendanceData[student] === 'present') {
                attendanceData[student] = 'absent';
                card.classList.add('absent');
                card.classList.remove('present');
            } else {
                delete attendanceData[student];
                card.classList.remove('present', 'absent');
            }
            
            saveAttendanceData();
            updateStats();
        }

        // 全部出勤
        function markAllPresent() {
            getStudentNames().forEach(name => {
                attendanceData[name] = 'present';
            });
            
            const cards = document.querySelectorAll('#attendanceGrid .student-card');
            cards.forEach(card => {
                card.classList.add('present');
                card.classList.remove('absent');
            });
            
            saveAttendanceData();
            updateStats();
        }

        // 重置考勤
        function resetAttendance() {
            if (confirm('确定要重置所有考勤记录吗？')) {
                attendanceData = {};
                const cards = document.querySelectorAll('#attendanceGrid .student-card');
                cards.forEach(card => {
                    card.classList.remove('present', 'absent');
                });
                
                saveAttendanceData();
                updateStats();
            }
        }

        // 导出考勤
        function exportAttendance() {
            const date = new Date().toLocaleDateString();
            let report = `考勤报告 - ${date}\n\n`;
            
            const studentNames = getStudentNames();
            const present = studentNames.filter(s => attendanceData[s] === 'present');
            const absent = studentNames.filter(s => attendanceData[s] === 'absent');
            const unknown = studentNames.filter(s => !attendanceData[s]);
            
            report += `出勤学生（${present.length}人）：\n${present.join('、')}\n\n`;
            report += `缺勤学生（${absent.length}人）：\n${absent.join('、')}\n\n`;
            if (unknown.length > 0) {
                report += `未标记学生（${unknown.length}人）：\n${unknown.join('、')}\n\n`;
            }
            report += `出勤率：${((present.length / studentNames.length) * 100).toFixed(1)}%`;
            
            const blob = new Blob([report], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `考勤报告_${date.replace(/\//g, '-')}.txt`;
            a.click();
            URL.revokeObjectURL(url);
            
            showDataStatus('考勤数据导出成功');
        }

        // 更新统计数据
        function updateStats() {
            const studentNames = getStudentNames();
            const present = Object.values(attendanceData).filter(status => status === 'present').length;
            const absent = Object.values(attendanceData).filter(status => status === 'absent').length;
            const rate = studentNames.length > 0 ? ((present / studentNames.length) * 100).toFixed(1) : 0;
            
            const totalScores = Object.values(studentScores).reduce((sum, score) => sum + (score || 0), 0);
            const averageScore = studentNames.length > 0 ? (totalScores / studentNames.length).toFixed(1) : 0;
            
            document.getElementById('totalStudents').textContent = studentNames.length;
            document.getElementById('presentStudents').textContent = present;
            document.getElementById('absentStudents').textContent = absent;
            document.getElementById('attendanceRate').textContent = rate + '%';
            document.getElementById('totalScores').textContent = totalScores;
            document.getElementById('averageScore').textContent = averageScore;
        }

        // 页面卸载前保存数据
        window.addEventListener('beforeunload', function() {
            saveStudentsData();
            saveScoreData();
            saveScoreHistory();
            saveAttendanceData();
            saveGroupsData();
        });

        // 点击模态框外部关闭
        window.addEventListener('click', function(event) {
            const editModal = document.getElementById('editStudentModal');
            const importModal = document.getElementById('importStudentsModal');
            
            if (event.target === editModal) {
                closeEditModal();
            }
            if (event.target === importModal) {
                closeImportModal();
            }
        });

        // 页面加载完成后初始化
        window.onload = init;
    </script>
</body>
</html>
